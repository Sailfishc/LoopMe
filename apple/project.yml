# Generate the Xcode project with:  cd apple && xcodegen generate
# Before building, set DEVELOPMENT_TEAM and the bundle ids below (see docs/build.md).
name: LoopMe
options:
  bundleIdPrefix: com.example.loopme
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
packages:
  LoopMeKit:
    path: LoopMeKit
targets:
  LoopMe:
    type: application
    platform: iOS
    sources:
      - path: iOS
    dependencies:
      - package: LoopMeKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.loopme.ios
        PRODUCT_NAME: LoopMe
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: iOS/Info.plist
      properties:
        CFBundleDisplayName: LoopMe
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIBackgroundModes: [remote-notification]
        NSCameraUsageDescription: 扫描 Mac 上显示的二维码来完成配对。
        NSLocalNetworkUsageDescription: 通过局域网或公司 VPN 连接你的 Mac。
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
          NSAllowsLocalNetworking: true
        CFBundleURLTypes:
          - CFBundleURLName: com.example.loopme.pair
            CFBundleURLSchemes: [loopme]
    entitlements:
      path: iOS/LoopMe.entitlements
      properties:
        aps-environment: development

  LoopMeMac:
    type: application
    platform: macOS
    sources:
      - path: Mac
    dependencies:
      - package: LoopMeKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.loopme.mac
        PRODUCT_NAME: LoopMe
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_HARDENED_RUNTIME: YES
    info:
      path: Mac/Info.plist
      properties:
        CFBundleDisplayName: LoopMe
        LSUIElement: true
        LSMinimumSystemVersion: "14.0"
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
          NSAllowsLocalNetworking: true
        NSAppleEventsUsageDescription: 用于打开“终端”运行 codex login。
    entitlements:
      path: Mac/LoopMe.entitlements
      properties:
        com.apple.security.app-sandbox: false
    postCompileScripts:
      - name: Build loopme-daemon (Rust)
        script: "\"${SRCROOT}/scripts/build-daemon.sh\""
        basedOnDependencyAnalysis: false
        shell: /bin/bash
