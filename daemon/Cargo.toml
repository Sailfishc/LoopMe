[package]
name = "loopme-daemon"
version = "0.1.0"
edition = "2021"
description = "LoopMe desktop daemon: personal agent orchestration, storage, pairing and push"
license = "UNLICENSED"
publish = false

[lib]
name = "loopme"
path = "src/lib.rs"

[[bin]]
name = "loopme-daemon"
path = "src/main.rs"

[dependencies]
anyhow = "1"
base64 = "0.22"
chacha20poly1305 = "0.10"
chrono = { version = "0.4", features = ["serde"] }
futures-util = "0.3"
hkdf = "0.12"
if-addrs = "0.13"
jsonwebtoken = "9"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "http2", "json"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.24"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }
x25519-dalek = { version = "2", features = ["static_secrets"] }

[dev-dependencies]
tempfile = "3"
